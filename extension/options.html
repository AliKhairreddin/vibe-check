<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdChecked Live Scanner Settings</title>
    <link rel="stylesheet" href="extension.css">
  </head>
  <body class="options">
    <main>
      <div class="brand">
        <span class="pulse"></span>
        <div>
          <strong>AdChecked</strong>
          <span>Live Scanner Settings</span>
        </div>
      </div>
      <form id="settings-form">
        <label class="switch-row">
          <span>
            <strong>Automatic scanning</strong>
            <small>Run whenever this browser observes Ads Manager.</small>
          </span>
          <input id="enabled" type="checkbox">
        </label>
        <label>
          <span>AdChecked URL</span>
          <input id="server-url" type="url" required placeholder="https://admin.adchecked.com">
        </label>
        <label>
          <span>Scanner access password</span>
          <input id="app-password" type="password" autocomplete="off">
          <small>Use the owner password. The server accepts it only on live-scanner ingest routes.</small>
        </label>
        <div class="actions">
          <button type="submit">Save settings</button>
          <span id="saved" class="muted" aria-live="polite"></span>
        </div>
      </form>
      <p class="notice">
        Facebook passwords, cookies, and session tokens are never sent to AdChecked.
        Only observed ad metadata and requested creative media are submitted.
      </p>
    </main>
    <script src="options.js"></script>
  </body>
</html>
