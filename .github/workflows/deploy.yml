name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Convex and Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.4.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Verify
        run: pnpm run verify

      - name: Check required deployment secrets
        run: |
          missing=0
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN CONVEX_DEPLOY_KEY; do
            value=$(printenv "$name" || true)
            if [ -z "$value" ]; then
              echo "::error::$name is not set in GitHub Actions secrets"
              missing=1
            fi
          done
          exit "$missing"

      - name: Deploy Convex
        run: pnpm exec convex deploy

      - name: Check Docker
        run: docker version

      - name: Deploy Cloudflare
        run: pnpm exec wrangler deploy

      - name: Wait for Cloudflare container rollout
        run: |
          app_id=$(pnpm exec wrangler containers list --json | jq -r '.[] | select(.name == "vibe-check-reviewbackend") | .id')
          if [ -z "$app_id" ]; then
            echo "::error::Cloudflare container application was not found"
            exit 1
          fi
          for attempt in $(seq 1 90); do
            info=$(pnpm exec wrangler containers info "$app_id")
            errors=$(echo "$info" | jq '.health.errors | length')
            healthy=$(echo "$info" | jq '.health.instances.healthy')
            rollout=$(echo "$info" | jq -r '.active_rollout_id // empty')
            if [ "$errors" -gt 0 ]; then
              echo "$info"
              echo "::error::Cloudflare container rollout reported an error"
              exit 1
            fi
            if [ -z "$rollout" ] && [ "$healthy" -ge 1 ]; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for the Cloudflare container rollout"
          exit 1

      - name: Activate Worker after container rollout
        run: pnpm exec wrangler deploy --containers-rollout=none
