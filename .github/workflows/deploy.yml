name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Convex and Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 9.4.0

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Verify
        run: pnpm run verify

      - name: Verify bundled PaddleOCR and concurrent processing
        run: |
          docker build --tag vibe-check-ocr-benchmark .
          timeout 300s docker run --rm --network none --cpus 4 --entrypoint python \
            --volume "$PWD/scripts/benchmark-ocr.py:/app/scripts/benchmark-ocr.py:ro" \
            vibe-check-ocr-benchmark /app/scripts/benchmark-ocr.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check required deployment secrets
        run: |
          missing=0
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN CONVEX_DEPLOY_KEY; do
            value=$(printenv "$name" || true)
            if [ -z "$value" ]; then
              echo "::error::$name is not set in GitHub Actions secrets"
              missing=1
            fi
          done
          exit "$missing"

      - name: Deploy Convex
        run: pnpm exec convex deploy

      - name: Initialize publisher workspaces
        run: python scripts/setup-publisher-workspaces.py

      - name: Check Docker
        run: docker version

      - name: Deploy Cloudflare
        run: |
          retry_wrangler() {
            local attempt output
            for attempt in $(seq 1 5); do
              if output=$(pnpm exec wrangler "$@"); then
                printf '%s\n' "$output"
                return 0
              fi
              if [ "$attempt" -eq 5 ]; then
                printf '%s\n' "$output" >&2
                return 1
              fi
              echo "::warning::Wrangler command failed (attempt $attempt/5); retrying in 10 seconds" >&2
              sleep 10
            done
          }

          deployment=$(retry_wrangler deployments status --json)
          version_id=$(echo "$deployment" | jq -r '.versions[] | select(.percentage == 100) | .version_id' | head -n 1)
          current_slot=""
          current_shards=""
          if [ -n "$version_id" ]; then
            version=$(retry_wrangler versions view "$version_id" --json)
            current_slot=$(echo "$version" | jq -r '.resources.bindings[]? | select(.name == "BACKEND_SLOT") | .text' | head -n 1)
            current_shards=$(echo "$version" | jq -r '.resources.bindings[]? | select(.name == "REVIEW_BACKEND_SHARDS") | .text' | head -n 1)
          fi
          current_slot=${current_slot:-primary-v25}
          current_shards=${current_shards:-10}
          configured_shards=$(jq -r '.vars.REVIEW_BACKEND_SHARDS' wrangler.jsonc)
          echo "CONFIGURED_BACKEND_SHARDS=$configured_shards" >> "$GITHUB_ENV"
          if [ "$current_slot" = "primary-blue" ]; then
            next_slot=primary-green
          else
            next_slot=primary-blue
          fi
          echo "CURRENT_BACKEND_SLOT=$current_slot" >> "$GITHUB_ENV"
          echo "NEXT_BACKEND_SLOT=$next_slot" >> "$GITHUB_ENV"
          # Preserve routing while the new image rolls out. --keep-vars alone
          # would silently retain the old shard count at activation as well.
          retry_wrangler deploy --keep-vars --var "BACKEND_SLOT:$current_slot" --var "REVIEW_BACKEND_SHARDS:$current_shards"

      - name: Wait for Cloudflare container rollout
        run: |
          retry_wrangler() {
            local attempt output
            for attempt in $(seq 1 5); do
              if output=$(pnpm exec wrangler "$@"); then
                printf '%s\n' "$output"
                return 0
              fi
              if [ "$attempt" -eq 5 ]; then
                printf '%s\n' "$output" >&2
                return 1
              fi
              echo "::warning::Wrangler command failed (attempt $attempt/5); retrying in 10 seconds" >&2
              sleep 10
            done
          }

          applications=$(retry_wrangler containers list --json)
          app_id=$(echo "$applications" | jq -r '.[] | select(.name == "vibe-check-reviewbackend") | .id')
          if [ -z "$app_id" ]; then
            echo "::error::Cloudflare container application was not found"
            exit 1
          fi
          for attempt in $(seq 1 90); do
            info=$(retry_wrangler containers info "$app_id")
            errors=$(echo "$info" | jq '.health.errors | length')
            rollout=$(echo "$info" | jq -r '.active_rollout_id // empty')
            if [ "$errors" -gt 0 ]; then
              echo "$info"
              echo "::error::Cloudflare container rollout reported an error"
              exit 1
            fi
            # Zero healthy instances is valid when all containers are asleep.
            # The activation health check below verifies the new image starts.
            if [ -z "$rollout" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for the Cloudflare container rollout"
          exit 1

      - name: Activate Worker after container rollout
        run: |
          retry_wrangler() {
            local attempt output
            for attempt in $(seq 1 5); do
              if output=$(pnpm exec wrangler "$@"); then
                printf '%s\n' "$output"
                return 0
              fi
              if [ "$attempt" -eq 5 ]; then
                printf '%s\n' "$output" >&2
                return 1
              fi
              echo "::warning::Wrangler command failed (attempt $attempt/5); retrying in 10 seconds" >&2
              sleep 10
            done
          }

          retry_wrangler deploy --containers-rollout=none --keep-vars --var "BACKEND_SLOT:$NEXT_BACKEND_SLOT" --var "REVIEW_BACKEND_SHARDS:$CONFIGURED_BACKEND_SHARDS"

      - name: Check activated backend
        run: |
          python - <<'PY'
          import os, subprocess, time
          import httpx
          secret = subprocess.run(['pnpm', 'exec', 'convex', 'env', 'get', 'CONVEX_HTTP_SECRET'],
                                  capture_output=True, text=True, check=True).stdout.strip()
          if not secret:
              raise RuntimeError('Backend health-check credential is unavailable')
          for attempt in range(7):
              try:
                  response = httpx.get('https://admin.adchecked.com/api/internal/queue-state',
                                       headers={'x-automation-secret': secret}, timeout=120)
                  response.raise_for_status()
                  state = response.json()
                  assert state['workers'] > 0, 'No live job workers'
                  assert state['configured_shards'] == int(os.environ['CONFIGURED_BACKEND_SHARDS']), 'Wrong shard configuration'
                  assert state['ocr'] == {'engine': 'PP-OCRv6_small', 'ready': True, 'workers': 2, 'cpu_threads': 1}, 'Wrong OCR engine or readiness'
                  print('Activated backend is healthy; shard and OCR configuration verified.')
                  break
              except Exception:
                  if attempt == 6:
                      raise
                  time.sleep(10)
          PY
